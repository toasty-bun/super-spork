<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#1E293B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Task Tracker</title>
<style>
:root{
  --bg:#F1F5F9;--surface:#fff;--surface2:#F8FAFC;--col:#E9EEF4;--border:#E2E8F0;--border2:#CBD5E1;
  --text:#0F172A;--text2:#334155;--muted:#64748B;--faint:#94A3B8;
  --accent:#4F46E5;--accent-soft:#EEF2FF;--accent-text:#4338CA;
  --danger:#DC2626;--danger-soft:#FEE2E2;--warn-soft:#FEF9C3;--warn-text:#A16207;--ok:#16A34A;--ok-soft:#DCFCE7;
  --head:#1E293B;--shadow:0 1px 2px rgba(15,23,42,.06);
  --pill-l:92%;--pill-t:28%;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#0B1220;--surface:#1B2537;--surface2:#131C2E;--col:#131C2E;--border:#2A3650;--border2:#3B4A68;
  --text:#E5E7EB;--text2:#CBD5E1;--muted:#94A3B8;--faint:#64748B;
  --accent:#818CF8;--accent-soft:#252A5C;--accent-text:#C7D2FE;
  --danger:#F87171;--danger-soft:#3B1D24;--warn-soft:#3A3212;--warn-text:#FCD34D;--ok:#4ADE80;--ok-soft:#12331F;
  --head:#0F172A;--shadow:none;
  --pill-l:24%;--pill-t:82%;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
button:disabled{opacity:.5;cursor:default;}
input,textarea,select{background:var(--surface);border:1.5px solid var(--border2);border-radius:8px;padding:8px 10px;width:100%;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical;}
code{background:var(--border);border-radius:4px;padding:0 4px;font-size:.92em;}

/* header */
.head{background:var(--head);position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);}
.head-in{max-width:1400px;margin:0 auto;padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.head h1{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.3px;}
.head .sub{font-size:11px;color:#9CA3AF;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:1px;}
.chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;}
.tabs{max-width:1400px;margin:0 auto;padding:8px 14px 0;display:flex;gap:2px;}
.tab{flex:1;max-width:220px;padding:9px 4px;color:#9CA3AF;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;}
.tab.on{background:var(--bg);color:var(--accent);}
[data-theme=dark] .tab.on{color:#C7D2FE;}
.badge{background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:800;padding:1px 6px;}
.btn{background:var(--accent);color:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;white-space:nowrap;}
[data-theme=dark] .btn:not(.alt):not(.danger):not(.outline):not(.ok){color:#0B1220;}
.btn.outline{background:transparent;color:#E5E7EB;border:1.5px solid #4B5563;}
.btn.alt{background:var(--surface);color:var(--text2);border:1.5px solid var(--border2);}
.btn.danger{background:var(--surface);color:var(--danger);border:1.5px solid var(--danger-soft);}
.btn.ok{background:var(--ok);color:#fff;}
[data-theme=dark] .btn.ok{color:#0B1220;}
.icon-btn{color:#9CA3AF;font-size:17px;padding:4px 6px;}

.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px;}
.wrap.wide{max-width:none;padding:14px 14px 40px;}

/* board */
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.toolbar input[type=search]{flex:1;min-width:140px;padding:7px 10px;font-size:13px;width:auto;}
.toolbar select{width:auto;padding:6px 8px;font-size:12px;font-weight:600;}
.stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-width:84px;flex:1;}
.stat b{display:block;font-size:20px;font-weight:800;}
.stat span{font-size:11px;color:var(--muted);font-weight:600;}
.nudge{background:var(--accent-soft);border:1.5px solid var(--border2);color:var(--accent-text);border-radius:10px;padding:9px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;}
.nudge.warn{background:var(--warn-soft);color:var(--warn-text);}
.nudge.bad{background:var(--danger-soft);color:var(--danger);}
.nudge button{margin-left:auto;background:var(--accent);color:#fff;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:700;white-space:nowrap;}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;align-items:flex-start;}
.col{flex:1 0 230px;min-width:230px;background:var(--col);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:200px;scroll-snap-align:start;border:2px solid transparent;transition:border-color .15s,background .15s;}
.col.over{border-color:var(--accent);background:var(--accent-soft);}
.col-head{padding:10px 12px 4px;display:flex;align-items:baseline;gap:8px;}
.col-head h2{font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;}
.col-head .n{font-size:11px;font-weight:800;color:var(--muted);background:var(--surface);border-radius:99px;padding:1px 8px;}
.col-head .clear{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700;}
.col-hint{font-size:11px;color:var(--muted);padding:0 12px 6px;}
.qa{padding:0 8px 8px;}
.qa input{border-style:dashed;background:var(--surface2);font-size:13px;}
.qa input:focus{border-style:solid;background:var(--surface);}
.col-body{overflow-y:auto;padding:0 8px 10px;display:flex;flex-direction:column;gap:7px;flex:1;}
.empty{font-size:12px;color:var(--faint);text-align:center;padding:16px 6px;font-style:italic;}
.tail{align-self:center;color:var(--accent);font-size:12px;font-weight:700;padding:6px;}
.col-body:has(.ph)>.empty{display:none;}
.card{background:var(--surface);border-radius:9px;border:1px solid var(--border);border-left:4px solid hsl(var(--h,220) var(--s,12%) 55%);padding:9px 10px 8px;box-shadow:var(--shadow);cursor:grab;position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.card:hover{box-shadow:0 3px 8px rgba(15,23,42,.12);}
.card.overdue{background:color-mix(in srgb,var(--danger-soft) 45%,var(--surface));}
.card.done{opacity:.6;}
.card-top{display:flex;gap:8px;align-items:flex-start;}
.chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);background:var(--surface);flex-shrink:0;margin-top:1px;font-size:11px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chk.on{background:var(--ok);border-color:var(--ok);}
.title{font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-word;flex:1;}
.card.done .title{text-decoration:line-through;color:var(--faint);font-weight:500;}
.meta{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px;padding-left:26px;}
.pill{font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px;white-space:nowrap;background:hsl(var(--h,220) var(--s,12%) var(--pill-l));color:hsl(var(--h,220) calc(var(--s,12%) + 20%) var(--pill-t));}
.pill.n{background:var(--border);color:var(--text2);}
.pill.hi{background:var(--danger-soft);color:var(--danger);}
.pill.ac{background:var(--accent-soft);color:var(--accent-text);}
.pill.w{background:var(--warn-soft);color:var(--warn-text);}
.pill.ok{background:var(--ok-soft);color:var(--ok);}
.sub{font-size:11.5px;color:var(--muted);margin-top:4px;padding-left:26px;line-height:1.4;word-break:break-word;}
.mv{display:none;position:absolute;right:6px;bottom:6px;gap:3px;}
.mv button{border:1px solid var(--border);background:var(--surface);border-radius:6px;width:24px;height:22px;font-size:12px;color:var(--muted);line-height:1;}
.card:hover .mv{display:flex;}
@media (hover:none){.mv{display:flex;position:static;justify-content:flex-end;margin-top:6px;}.mv button{width:34px;height:28px;font-size:14px;}}
@media (max-width:640px){.col{flex:0 0 86vw;max-height:calc(100vh - 270px);}.stat{min-width:70px;padding:7px 10px;}.stat b{font-size:17px;}}

/* dragging */
.ph{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:9px;min-height:44px;opacity:.7;}
.ghost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;box-shadow:0 12px 28px rgba(15,23,42,.3)!important;opacity:.96;cursor:grabbing;margin:0!important;}
body.dragging,body.dragging *{cursor:grabbing!important;}

/* projects */
.pj-list{display:flex;flex-direction:column;gap:6px;}
.pj{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.pj.open{box-shadow:0 2px 8px rgba(15,23,42,.08);}
.pj-row{display:grid;grid-template-columns:22px 10px minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;}
.handle{cursor:grab;color:var(--faint);font-weight:900;letter-spacing:-3px;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center;font-size:15px;padding:6px 0;}
.handle.off{visibility:hidden;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0;}
.pj-name b{display:block;font-size:14px;font-weight:800;word-break:break-word;}
.pj-name span{font-size:11.5px;color:var(--muted);}
.pj-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:min(380px,44vw);}
.bar{flex:1;height:7px;background:var(--border);border-radius:99px;overflow:hidden;min-width:60px;}
.bar i{display:block;height:100%;border-radius:99px;}
.pj-prog{display:flex;align-items:center;gap:6px;width:130px;font-size:12px;font-weight:700;}
.pj-due{font-size:12px;font-weight:700;min-width:84px;}
.pj-chev{color:var(--faint);font-size:12px;}
.pj-detail{padding:2px 14px 14px 54px;}
.linked{display:flex;gap:7px;align-items:center;padding:6px 8px;background:var(--surface2);border-radius:7px;cursor:pointer;margin-bottom:5px;}
.pj-ph{border:2px dashed var(--accent);background:var(--accent-soft);border-radius:10px;opacity:.7;}
.pj.ghost{border-radius:10px;}
@media (max-width:640px){.pj-row{grid-template-columns:22px 10px minmax(0,1fr) 14px;}.pj-stats{grid-column:3/5;grid-row:2;width:auto;gap:8px;}.pj-chev{grid-column:4;grid-row:1;}.handle{grid-row:1/3;}.pj-detail{padding:2px 12px 12px;}}

/* parking */
.park-tip{background:var(--warn-soft);border:1.5px solid var(--border2);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;color:var(--warn-text);}
.list-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.park-item{padding:12px 13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.park-item:last-child{border-bottom:none;}
.label-up{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}

/* segmented */
.seg{display:inline-flex;background:var(--bg);border-radius:8px;padding:2px;}
.seg button{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted);}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

/* modal */
#modal-root:empty{display:none;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px 18px 36px;}
@media (min-width:700px){.overlay{align-items:center;}.sheet{border-radius:16px;padding-bottom:22px;}}
.sheet h3{font-size:15px;font-weight:700;margin-bottom:14px;}
.f{margin-bottom:12px;}
.f label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.actions{display:flex;gap:8px;align-items:center;margin-top:4px;}
.actions .sp{flex:1;}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--head);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center;}
#toast:empty{display:none;}

/* focus mode */
.fm{min-height:100vh;padding-bottom:60px;}
.fm-top{background:var(--head);color:#fff;position:sticky;top:0;z-index:50;padding-top:env(safe-area-inset-top);}
.fm-top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.fm-title{font-size:16px;font-weight:800;}
.fm-sub{font-size:11px;color:#9CA3AF;}
.fm-timer{order:2;margin-left:auto;display:flex;align-items:center;gap:5px;}
.fm-time{font-variant-numeric:tabular-nums;font-size:20px;font-weight:800;min-width:62px;text-align:center;}
.tbtn{background:rgba(255,255,255,.1);color:#E5E7EB;border-radius:7px;padding:6px 9px;font-size:12px;font-weight:700;white-space:nowrap;}
.tbtn.on{background:var(--accent);color:#fff;}
.fm-exit{order:3;border:1.5px solid #4B5563;color:#E5E7EB;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;}
.fm-body{max-width:760px;margin:0 auto;padding:22px 16px;}
.fm-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;}
.fm-now{background:var(--surface);border:1px solid var(--border);border-left:6px solid hsl(var(--h,220) var(--s,12%) 55%);border-radius:16px;padding:22px 22px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);}
.fm-now h1{font-size:26px;line-height:1.25;font-weight:800;margin:10px 0 4px;word-break:break-word;cursor:pointer;}
.fm-notes{font-size:14px;color:var(--text2);line-height:1.55;margin-top:12px;white-space:pre-wrap;background:var(--surface2);border-radius:10px;padding:10px 12px;max-height:220px;overflow:auto;word-break:break-word;}
.fm-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.fm-actions button{border-radius:10px;padding:11px 15px;font-size:14px;font-weight:800;background:var(--border);color:var(--text2);}
.fm-actions .go{background:var(--ok);color:#fff;flex:1 1 150px;}
.fm-next{margin-top:26px;}
.fm-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid hsl(var(--h,220) var(--s,12%) 55%);border-radius:10px;padding:9px 12px;margin-bottom:6px;}
.fm-item .t{flex:1;min-width:0;font-size:14px;font-weight:600;word-break:break-word;cursor:pointer;}
.fm-item .d{font-size:11.5px;color:var(--muted);white-space:nowrap;}
.fm-item button{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;}
.fm-empty{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 20px;}
.fm-stat{font-size:13px;color:var(--muted);margin-top:18px;text-align:center;}
.fm-enter{background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:800;white-space:nowrap;}
[data-theme=dark] .fm-enter{color:#0B1220;}
@media (max-width:640px){.fm-now{padding:18px 16px 14px;}.fm-now h1{font-size:22px;}.fm-timer{margin-left:0;width:100%;justify-content:space-between;order:3;}.fm-exit{order:2;margin-left:auto;}}

/* install banners */
.install{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--head);color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:200;border-top:2px solid var(--accent);align-items:center;gap:12px;font-size:13px;line-height:1.4;}
.install.show{display:flex;}
.install p{flex:1;}
.install .later{border:1px solid #4B5563;color:#9CA3AF;border-radius:8px;padding:9px 12px;font-size:12px;}
</style>
<script>try{var t=localStorage.getItem('pt_theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div id="install-banner" class="install"><p><strong>Install Task Tracker</strong><br>Add it to your home screen for quick access.</p><button class="later" onclick="dismissInstall()">Later</button><button class="btn" onclick="triggerInstall()">Install</button></div>
<div id="ios-hint" class="install"><p>To install on iPhone: tap the <strong>Share</strong> button in Safari, then <strong>Add to Home Screen</strong>.</p><button class="later" onclick="dismissIosHint()">Got it</button></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════════════
   SETTINGS YOU CAN EDIT
   ════════════════════════════════════════════════════════════════════════════ */

// Your web app's Firebase configuration
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAPXIFv_MtFXWLswP9lpjHkANa_tCMgzyo",
  authDomain: "super-spork-d7528.firebaseapp.com",
  projectId: "super-spork-d7528",
  storageBucket: "super-spork-d7528.firebasestorage.app",
  messagingSenderId: "330652733907",
  appId: "1:330652733907:web:e680930a03d517f8b09f26"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

// 2) Categories. h = colour hue (0-360), s = colour saturation % (use ~12 for grey).
const CATEGORIES = [
  { name: 'Home',     h: 210, s: 75 },
  { name: 'Errands',  h: 32,  s: 85 },
  { name: 'Health',   h: 150, s: 60 },
  { name: 'Money',    h: 265, s: 70 },
  { name: 'Projects', h: 330, s: 70 },
  { name: 'Admin',    h: 220, s: 12 },
];
const DEFAULT_CATEGORY = 'Admin';

/* ════════════════════════════════════════════════════════════════════════════
   BASICS
   ════════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} },
};
const loadJSON = (k,fb) => { try{ const v = JSON.parse(ls.get(k)||'null'); return v==null?fb:v; }catch{ return fb; } };
const esc = v => String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = () => 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// Dates are all LOCAL time, stored as YYYY-MM-DD
const pad = n => String(n).padStart(2,'0');
const dstr = (d=new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr();
const parseLocal = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseLocal(s); d.setDate(d.getDate()+n); return dstr(d); };
const addMonths = (s,n) => { const d = parseLocal(s); d.setMonth(d.getMonth()+n); return dstr(d); };
const daysLeft = s => s ? Math.round((parseLocal(s)-parseLocal(today()))/86400000) : null;
const fmtDate = s => { if(!s) return ''; const [y,m,d]=s.split('-'); return `${m}/${d}/${y}`; };
function fmtShort(s){
  if(!s) return ''; const n = daysLeft(s);
  if(n===0) return 'Today'; if(n===1) return 'Tomorrow'; if(n===-1) return 'Yesterday';
  const dt = parseLocal(s), wd = dt.toLocaleDateString('en-US',{weekday:'short'});
  return (n>1&&n<7) ? wd : `${wd} ${dt.getMonth()+1}/${dt.getDate()}`;
}
const nowTime = () => new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

/* ════════════════════════════════════════════════════════════════════════════
   MODEL
   ════════════════════════════════════════════════════════════════════════════ */
const PRIORITIES = ['High','Medium','Low'];
const PRI_ORD = { High:0, Medium:1, Low:2 };
const HEALTH = ['On Track','At Risk','Delayed','On Hold','Complete'];
const HEALTH_DOT = { 'On Track':'#16A34A','At Risk':'#EAB308','Delayed':'#DC2626','On Hold':'#94A3B8','Complete':'#16A34A' };
const LANES = [
  { id:'backlog', label:'Backlog',   hint:'Put it down and leave it here' },
  { id:'week',    label:'This Week', hint:'Getting done this week' },
  { id:'today',   label:'Today',     hint:'What you’re working on now' },
  { id:'waiting', label:'Waiting',   hint:'Waiting on someone or something' },
  { id:'done',    label:'Done',      hint:'' },
];
const LANE_IDS = LANES.map(l => l.id);
const laneLabel = id => (LANES.find(l=>l.id===id)||{}).label || id;
const REPEATS = [{id:'none',label:'Does not repeat'},{id:'daily',label:'Every day'},{id:'weekdays',label:'Every weekday'},{id:'weekly',label:'Every week'},{id:'monthly',label:'Every month'}];
const REPEAT_IDS = REPEATS.map(r => r.id);
const catOf = name => CATEGORIES.find(c => c.name===name) || { name, h:220, s:12 };
const catStyle = name => { const c = catOf(name); return `--h:${c.h};--s:${c.s}%;`; };

function laneForDue(d){
  if(!d) return 'backlog';
  if(d <= today()) return 'today';
  if(d <= addDays(today(),6)) return 'week';
  return 'backlog';
}
function normTask(src){
  const t = { ...src };
  t.id = String(t.id ?? uid());
  t.title = String(t.title ?? '');
  if(!CATEGORIES.some(c=>c.name===t.category)) t.category = t.category || DEFAULT_CATEGORY;
  if(!PRIORITIES.includes(t.priority)) t.priority = 'Medium';
  if(!REPEAT_IDS.includes(t.repeat)) t.repeat = 'none';
  t.due = t.due || '';
  t.project = t.project || '';
  t.notes = t.notes || '';
  if(t.done) t.lane = 'done';
  else if(!LANE_IDS.includes(t.lane) || t.lane==='done') t.lane = laneForDue(t.due);
  t.done = t.lane==='done';
  t.completedAt = t.done ? (t.completedAt || today()) : null;
  return t;
}
function autoSort(arr){
  return arr.slice().sort((a,b)=>{
    const oa = isOverdue(a)?0:1, ob = isOverdue(b)?0:1; if(oa!==ob) return oa-ob;
    const p = PRI_ORD[a.priority]-PRI_ORD[b.priority]; if(p) return p;
    const da = a.due||'9999', db = b.due||'9999'; if(da!==db) return da<db?-1:1;
    return a.title.localeCompare(b.title);
  });
}
const hasOrder = x => typeof x.order==='number' && isFinite(x.order);
function assignOrders(tasks){
  const by = {}; tasks.forEach(t => (by[t.lane] = by[t.lane]||[]).push(t));
  Object.values(by).forEach(arr => {
    const missing = arr.filter(t=>!hasOrder(t)); if(!missing.length) return;
    let max = Math.max(0, ...arr.filter(hasOrder).map(t=>t.order));
    autoSort(missing).forEach(t => { max += 1000; t.order = max; });
  });
  return tasks;
}
const normTasks = arr => assignOrders((arr||[]).map(normTask));
const isOverdue = t => !!t.due && !t.done && t.due < today();

function normProjects(arr){
  const list = (arr||[]).map(p => ({ ...p, id:String(p.id), name:String(p.name||''), health: HEALTH.includes(p.health)?p.health:'On Track', pct: Math.max(0,Math.min(100,+p.pct||0)) }));
  let max = Math.max(0, ...list.filter(hasOrder).map(p=>p.order));
  list.filter(p=>!hasOrder(p)).forEach(p => { max += 1000; p.order = max; });
  return list.sort((a,b)=>a.order-b.order);
}
const sortLane = (lane, arr) => lane==='done'
  ? arr.slice().sort((a,b)=> String(b.completedAt||'').localeCompare(String(a.completedAt||'')) || (b.order||0)-(a.order||0))
  : arr.slice().sort((a,b)=> (a.order??0)-(b.order??0));

// Place an item between two neighbours in a manual-order list (renumbers first if the gap got too small)
function orderBetween(list, prev, next){
  if(!prev && !next) return 1000;
  if(!prev) return next.order - 1000;
  if(!next) return prev.order + 1000;
  if(Math.abs(next.order - prev.order) < 1e-6){
    list.slice().sort((a,b)=>a.order-b.order).forEach((x,i)=>{ x.order = (i+1)*1000; });
  }
  return (prev.order + next.order) / 2;
}
const laneTasks = (lane, excludeId) => state.tasks.filter(t => t.lane===lane && t.id!==String(excludeId));
const topOrder = (lane, excludeId) => { const o = laneTasks(lane,excludeId).map(t=>t.order); return o.length ? Math.min(...o)-1000 : 1000; };
const bottomOrder = (lane, excludeId) => { const o = laneTasks(lane,excludeId).map(t=>t.order); return o.length ? Math.max(...o)+1000 : 1000; };

function applyLane(t, lane){
  const u = { ...t, lane };
  if(lane==='done'){ u.done = true; u.completedAt = t.completedAt || today(); }
  else { u.done = false; u.completedAt = null; }
  return u;
}
// Repeating cards: finishing one creates the next
function nextDue(base, rep){
  if(rep==='none' || !REPEAT_IDS.includes(rep)) return null;
  const step = x => {
    if(rep==='daily') return addDays(x,1);
    if(rep==='weekly') return addDays(x,7);
    if(rep==='monthly') return addMonths(x,1);
    let y = addDays(x,1); while([0,6].includes(parseLocal(y).getDay())) y = addDays(y,1); return y;
  };
  let n = base || today(), guard = 0;
  do { n = step(n); guard++; } while(n <= today() && guard < 1000);
  return n;
}
function spawnRepeat(t){
  if(!t.repeat || t.repeat==='none' || t.spawnedNext) return null;
  const due = nextDue(t.due, t.repeat); if(!due) return null;
  return normTask({ id:uid(), title:t.title, category:t.category, project:t.project, priority:t.priority, due, notes:t.notes, repeat:t.repeat, lane:laneForDue(due) });
}

  { id:'s5', title:'Sort out the garage', category:'Home', priority:'Low', lane:'backlog' },
].map(t => ({ ...t, sample:true }));

const state = {
  tab: ls.get('pt_tab') || 'board',
  tasks: [], projects: [], parking: [],
  modal: null, settings: false,
  focusMode: ls.get('pt_focusmode')==='1',
  filterCat: 'All', search: '', showAllDone: false,
  openProj: {}, showDoneProj: false, showDoneLinked: {},
  imp: null,
};
state.tasks = normTasks(loadJSON('pt_tasks', SAMPLE_TASKS));
state.projects = normProjects(loadJSON('pt_projects', []));
state.parking = loadJSON('pt_parking', []);
const COLLS = ['tasks','projects','parking'];
function persist(){
  ls.set('pt_tasks', JSON.stringify(state.tasks));
  ls.set('pt_projects', JSON.stringify(state.projects));
  ls.set('pt_parking', JSON.stringify(state.parking));
}
let saveTimer = null;
const localSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ saveTimer=null; persist(); }, 250); };
const flushSave = () => { if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; persist(); } };
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='hidden') flushSave(); });

// Update state, save (locally + cloud) and redraw
function setState(u){
  const dataChanged = COLLS.some(k => k in u);
  if(u.tasks) u.tasks = assignOrders(u.tasks);
  if(u.projects) u.projects = normProjects(u.projects);
  Object.assign(state, u);
  if(dataChanged){ localSave(); cloudWrite(); }
  render();
}
let toastTimer = null;
function toast(msg){
  const el = $('#toast'); el.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.textContent=''; }, 3200);
}

/* ════════════════════════════════════════════════════════════════════════════
   CLOUD (Firebase: Google sign-in + Firestore, one doc per card under users/{uid})
   ════════════════════════════════════════════════════════════════════════════ */
const cloud = { configured: !!FIREBASE_CONFIG.apiKey, available:false, auth:null, db:null, user:null, base:null,
  ready:false, loaded:{}, unsubs:[], synced:{tasks:new Map(),projects:new Map(),parking:new Map()},
  logged:new Set(), pending:0, online:navigator.onLine, error:'' };
const cloudOn = () => !!(cloud.user && cloud.ready);
const collRef = c => cloud.base.collection(c);

function stableStr(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(Array.isArray(v)) return '['+v.map(stableStr).join(',')+']';
  return '{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';
}
const cleanDoc = x => { const o = JSON.parse(JSON.stringify(x)); o.id = String(x.id); delete o.sample; return o; }; // Firestore can't store undefined
const logEntry = t => ({ id:t.id, title:t.title, category:t.category, project:t.project||'', priority:t.priority, notes:t.notes||'', completedAt:t.completedAt||today() });

async function commitOps(ops){
  for(let i=0; i<ops.length; i+=400){ // batches max out at 500 writes
    const b = cloud.db.batch();
    ops.slice(i,i+400).forEach(([kind,ref,data]) => kind==='set' ? b.set(ref,data) : b.delete(ref));
    cloud.pending++; renderSoon();
    try{ await b.commit(); cloud.error=''; }
    catch(e){ cloud.error = e.message||String(e); console.warn('Cloud save failed', e); }
    finally{ cloud.pending--; renderSoon(); }
  }
}
// Compare state to what the cloud last had and write only the differences
function cloudWrite(){
  if(!cloudOn()) return;
  const ops = [];
  COLLS.forEach(c => {
    const cur = new Map(state[c].filter(x=>!x.sample).map(x => { const d = cleanDoc(x); return [d.id,d]; }));
    const prev = cloud.synced[c], next = new Map();
    cur.forEach((d,id) => { const s = stableStr(d); next.set(id,s); if(prev.get(id)!==s) ops.push(['set', collRef(c).doc(id), d]); });
    prev.forEach((_,id) => { if(!cur.has(id)) ops.push(['delete', collRef(c).doc(id)]); });
    cloud.synced[c] = next;
  });
  state.tasks.forEach(t => { if(t.done && !t.sample && !cloud.logged.has(t.id)){ cloud.logged.add(t.id); ops.push(['set', collRef('log').doc(t.id), logEntry(t)]); } });
  if(ops.length) commitOps(ops);
}
async function cloudLog(){ if(!cloudOn()) return []; try{ return (await collRef('log').get()).docs.map(d=>d.data()); }catch{ return []; } }

let renderSoonTimer = null;
function renderSoon(){ clearTimeout(renderSoonTimer); renderSoonTimer = setTimeout(render, 30); }

function applyRemote(c, snap){
  let items = snap.docs.map(d => d.data());
  cloud.synced[c] = new Map(items.map(x => [String(x.id), stableStr(cleanDoc(x))]));
  if(c==='tasks') items = normTasks(items);
  else if(c==='projects') items = normProjects(items);
  else items.sort((a,b)=>String(b.id).localeCompare(String(a.id)));
  state[c] = items;
  cloud.loaded[c] = true;
  if(!cloud.ready && COLLS.every(k=>cloud.loaded[k])) cloud.ready = true;
  persist();
  if(cloud.ready) cloudWrite(); // pushes anything normalisation changed (e.g. card positions)
  renderSoon();
}
// First time this browser signs in: upload its own cards that aren't in the cloud yet
async function linkDevice(user){
  const key = 'pt_linked_'+user.uid; if(ls.get(key)) return;
  const snaps = await Promise.all(COLLS.map(c => collRef(c).get()));
  const ops = []; let n = 0;
  COLLS.forEach((c,i) => {
    const have = new Set(snaps[i].docs.map(d=>d.id));
    state[c].filter(x=>!x.sample).forEach(x => { const d = cleanDoc(x); if(!have.has(d.id)){ ops.push(['set', collRef(c).doc(d.id), d]); if(c==='tasks') n++; } });
  });
  if(ops.length) await commitOps(ops);
  ls.set(key,'1');
  if(n) toast(`☁ Uploaded ${n} card${n!==1?'s':''} from this device`);
}
async function onSignedIn(user){
  cloud.user = user; cloud.base = cloud.db.collection('users').doc(user.uid);
  cloud.ready = false; cloud.loaded = {}; cloud.error = ''; renderSoon();
  try{ await linkDevice(user); }catch(e){ console.warn('Initial upload skipped', e); cloud.error = 'Could not reach the cloud for the first upload — will retry next time.'; }
  try{ (await collRef('log').get()).docs.forEach(d => cloud.logged.add(d.id)); }catch{}
  cloud.unsubs = COLLS.map(c => collRef(c).onSnapshot(snap => applyRemote(c,snap), err => { cloud.error = err.message; renderSoon(); }));
}
function onSignedOut(){
  cloud.unsubs.forEach(u => { try{u();}catch{} }); cloud.unsubs = [];
  cloud.user = null; cloud.base = null; cloud.ready = false; cloud.loaded = {};
  COLLS.forEach(c => cloud.synced[c] = new Map()); cloud.logged = new Set();
  renderSoon();
}
function initCloud(){
  if(!cloud.configured) return;
  if(!window.firebase){ cloud.error = 'Cloud library did not load (offline?). Working locally for now.'; return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    cloud.auth = firebase.auth(); cloud.db = firebase.firestore();
    cloud.db.enablePersistence({ synchronizeTabs:true }).catch(()=>{}); // offline cache
    cloud.available = true;
    cloud.auth.getRedirectResult().catch(e => { cloud.error = e.message; renderSoon(); });
    cloud.auth.onAuthStateChanged(u => u ? onSignedIn(u) : onSignedOut());
  }catch(e){ cloud.error = e.message; console.warn(e); }
}
window.cloudSignIn = async () => {
  if(!cloud.available){ toast('Cloud isn’t available right now — check your connection or Firebase config.'); return; }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ prompt:'select_account' });
  try{ await cloud.auth.signInWithPopup(provider); }
  catch(e){
    if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/cancelled-popup-request','auth/web-storage-unsupported'].includes(e.code)){
      try{ await cloud.auth.signInWithRedirect(provider); }catch(e2){ toast('Sign-in failed: '+e2.message); }
    } else if(e.code!=='auth/popup-closed-by-user') toast('Sign-in failed: '+(e.message||e.code));
  }
};
window.cloudSignOut = async () => {
  if(!confirm('Sign out of cloud sync on this device?\n\nYour cards stay safe in the cloud; this device keeps a local copy.')) return;
  try{ await cloud.auth.signOut(); }catch{}
};
window.addEventListener('online',  () => { cloud.online = true;  renderSoon(); });
window.addEventListener('offline', () => { cloud.online = false; renderSoon(); });

function cloudStatus(){
  if(!cloud.configured) return { label:'Local only', color:'#9CA3AF', tone:'n' };
  if(!cloud.available)  return { label:'Cloud unavailable', color:'#FBBF24', tone:'w' };
  if(!cloud.user)       return { label:'Sign in to sync', color:'#FBBF24', tone:'w' };
  if(!cloud.ready)      return { label:'Connecting…', color:'#93C5FD', tone:'ac' };
  if(cloud.error)       return { label:'Sync problem', color:'#F87171', tone:'hi' };
  if(!cloud.online)     return { label:'Offline — will sync', color:'#FBBF24', tone:'w' };
  if(cloud.pending)     return { label:'Saving…', color:'#93C5FD', tone:'ac' };
  return { label:'Synced', color:'#4ADE80', tone:'ok' };
}

/* ════════════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════════════ */
let renderPending = false, refocus = null;
function render(){
  if(drag && drag.active){ renderPending = true; return; } // don't rebuild mid-drag
  renderPending = false;
  const app = $('#app');
  const board = app.querySelector('.board'), boardX = board ? board.scrollLeft : 0;
  const colY = {}; app.querySelectorAll('.col-body').forEach(el => colY[el.dataset.body] = el.scrollTop);
  const ae = document.activeElement, aeId = ae && ae.id && app.contains(ae) ? ae.id : null;
  const caret = aeId && ae.selectionStart!=null ? ae.selectionStart : null;
  const y = window.scrollY;
  app.innerHTML = buildApp();
  const nb = app.querySelector('.board'); if(nb) nb.scrollLeft = boardX;
  app.querySelectorAll('.col-body').forEach(el => { if(colY[el.dataset.body]!=null) el.scrollTop = colY[el.dataset.body]; });
  const fid = refocus || aeId; refocus = null;
  if(fid){ const el = document.getElementById(fid); if(el){ el.focus({preventScroll:true}); if(caret!=null && fid===aeId && el.setSelectionRange) try{ el.setSelectionRange(caret,caret); }catch{} } }
  window.scrollTo(0,y);
}

function buildApp(){
  if(state.settings) return buildSettings();
  if(state.focusMode) return buildFocus();
  const open = state.tasks.filter(t=>!t.done);
  const counts = { today:open.filter(t=>t.lane==='today').length, week:open.filter(t=>t.lane==='week').length,
    waiting:open.filter(t=>t.lane==='waiting').length, over:open.filter(isOverdue).length };
  const parkCount = state.parking.filter(k=>!k.cleared).length;
  return `${buildHeader(counts, parkCount)}<div class="wrap${state.tab==='board'?' wide':''}">${buildCloudNotice()}${
    state.tab==='board' ? buildBoard(counts) : state.tab==='parking' ? buildParking() : buildProjects()}</div>`;
}
function buildHeader(counts, parkCount){
  const st = cloudStatus();
  const chipAct = cloud.available && !cloud.user ? 'cloudSignIn()' : 'openSettings()';
  const tabs = [{id:'board',label:'Board',n:counts.today},{id:'parking',label:'Parking',n:parkCount},{id:'projects',label:'Projects',n:0}];
  const add = { board:`<button class="btn outline" onclick="openImport()" title="Import from a list, an email, or a CSV / Excel file">⤓ Import</button><button class="btn" onclick="openTask(null,'backlog')">+ Card</button>`,
    parking:`<button class="btn" onclick="openPark()">🅿 Park it</button>`, projects:`<button class="btn" onclick="openProject(null)">+ Project</button>` }[state.tab];
  return `<div class="head"><div class="head-in"><div><h1>Task Tracker</h1><div class="sub">${esc(new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))}
      <button class="chip" onclick="${chipAct}" title="${esc(cloud.error||'Sync status')}" style="color:${st.color}">☁ ${esc(st.label)}</button></div></div>
    <div style="display:flex;align-items:center;gap:6px;"><button class="icon-btn" onclick="openSettings()" aria-label="Settings" title="Settings">⚙</button>${add}</div></div>
    <div class="tabs">${tabs.map(t=>`<button class="tab${state.tab===t.id?' on':''}" onclick="setTab('${t.id}')">${t.label}${t.n>0?`<span class="badge">${t.n}</span>`:''}</button>`).join('')}</div></div>`;
}
function buildCloudNotice(){
  if(!cloud.configured) return `<div class="nudge">☁ Running local-only — cards are saved in this browser. Add your Firebase config (see README) to sync across devices.</div>`;
  if(cloud.available && !cloud.user) return `<div class="nudge warn">☁ You’re not signed in, so changes are only saved on this device.<button onclick="cloudSignIn()" style="background:var(--ok)">Sign in to sync</button></div>`;
  if(cloud.user && cloud.error) return `<div class="nudge bad">☁ Sync problem: ${esc(cloud.error)}<button onclick="openSettings()" style="background:var(--danger)">Details</button></div>`;
  return '';
}

/* ── Board ─────────────────────────────────────────────────────────────────── */
function matches(t){
  if(state.filterCat!=='All' && t.category!==state.filterCat) return false;
  if(state.search && !`${t.title} ${t.project} ${t.notes}`.toLowerCase().includes(state.search.toLowerCase())) return false;
  return true;
}
function buildBoard(counts){
  const stats = [['Today',counts.today,'var(--accent)'],['This week',counts.week,'var(--text)'],['Waiting',counts.waiting,'var(--warn-text)'],['Overdue',counts.over,counts.over?'var(--danger)':'var(--ok)']]
    .map(([l,v,c]) => `<div class="stat"><b style="color:${c}">${v}</b><span>${l}</span></div>`).join('');
  const due = state.tasks.filter(t=>!t.done && (t.lane==='backlog'||t.lane==='week') && t.due && t.due<=today());
  const nudge = due.length ? `<div class="nudge">📌 ${due.length} card${due.length>1?'s are':' is'} due today or overdue but still in Backlog / This Week.<button onclick="pullDueIntoToday()">Move to Today</button></div>` : '';
  const catSel = `<select onchange="setFilterCat(this.value)" aria-label="Category"><option value="All">All categories</option>${CATEGORIES.map(c=>`<option${state.filterCat===c.name?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
  const toolbar = `<div class="toolbar"><button class="fm-enter" onclick="enterFocus()" title="One card at a time from Today, with a focus timer">🎯 Focus</button><input id="search" type="search" value="${esc(state.search)}" oninput="setSearch(this.value)" placeholder="Search cards…">${catSel}</div>`;
  return `<div class="stats">${stats}</div>${nudge}${toolbar}<div class="board">${LANES.map(buildColumn).join('')}</div>`;
}
function buildColumn(l){
  const all = state.tasks.filter(t=>t.lane===l.id);
  let items = sortLane(l.id, all.filter(matches)), more = '';
  if(l.id==='done' && !state.showAllDone && items.length>15){ more = `<button class="tail" onclick="setState({showAllDone:true})">Show all ${items.length}</button>`; items = items.slice(0,15); }
  const qa = l.id==='done' ? '' : `<form class="qa" onsubmit="quickAdd(event,'${l.id}')"><input id="qa-${l.id}" name="q" autocomplete="off" placeholder="+ Add a card"></form>`;
  const clear = l.id==='done' && all.length ? `<button class="clear" onclick="archiveCompleted()">Clear →</button>` : '';
  return `<section class="col" data-zone="${l.id}" data-kind="card">

window.moveTask = (id, lane, opts={}) => {
  const t = findTask(id); if(!t) return;
  const same = t.lane===lane;
  if(same && !opts.force) return;
  const u = same ? { ...t } : applyLane(t, lane);
  if(lane==='done') u.order = topOrder('done', id);
  else if(opts.force){
    const p = opts.prevId && findTask(opts.prevId), n = opts.nextId && findTask(opts.nextId);
    u.order = orderBetween(laneTasks(lane, id), p||null, n||null);
  } else u.order = topOrder(lane, id);
  let spawned = null;
  if(lane==='done' && !t.done){ spawned = spawnRepeat(t); if(spawned){ u.spawnedNext = true; spawned.order = topOrder(spawned.lane); } }
  const tasks = state.tasks.map(x => x.id===t.id ? u : x);
  setState({ tasks: spawned ? [spawned, ...tasks] : tasks });

};

/* ── Quick-add / quick-tag parser ──────────────────────────────────────────────
   #today #week #backlog #waiting · !high !low (or !!) · @home @errands … · due:fri due:9/30 due:+3
   *daily *weekdays *weekly *monthly · [Project name] · // notes                                     */
const LANE_TAGS = { backlog:'backlog', later:'backlog', someday:'backlog', week:'week', thisweek:'week', wk:'week', today:'today', now:'today', waiting:'waiting', wait:'waiting' };
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
function matchCategory(tag){
  const t = tag.toLowerCase().replace(/-/g,'');
  const c = CATEGORIES.find(c=>c.name.toLowerCase().replace(/[^a-z]/g,'')===t) || CATEGORIES.find(c=>c.name.toLowerCase().startsWith(t));
  return c ? c.name : null;
}
function parseDate(v){
  if(v==null) return ''; const s = String(v).trim().toLowerCase(); if(!s) return '';
  if(['today','tod','now'].includes(s)) return today();
  if(['tomorrow','tmrw','tmr','tom'].includes(s)) return addDays(today(),1);
  let m = s.match(/^\+(\d{1,3})d?$/); if(m) return addDays(today(), +m[1]);
  const di = DOW.indexOf(s.slice(0,3));
  if(di>=0 && /^[a-z]+$/.test(s)) return addDays(today(), (di - parseLocal(today()).getDay() + 7) % 7);
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?(?!\d)/);
  if(m){
    if(+m[1]<1||+m[1]>12||+m[2]<1||+m[2]>31) return '';
    let y = m[3] ? +m[3] : parseLocal(today()).getFullYear(); if(y<100) y += 2000;
    let d = `${y}-${pad(+m[1])}-${pad(+m[2])}`;
    if(!m[3] && d < addDays(today(),-60)) d = `${y+1}-${pad(+m[1])}-${pad(+m[2])}`;
    return d;
  }
  if(/^\d{5}(\.\d+)?$/.test(s)){ const dt = new Date(Date.UTC(1899,11,30)+parseFloat(s)*86400000); return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`; } // Excel serial date
  const t = Date.parse(String(v)); return isNaN(t) ? '' : dstr(new Date(t));
}
function parseQuick(raw, def={}){
  let s = String(raw||'').replace(/^\s*(?:[-*•▪◦–]|\d+[.)]|\[[ xX]?\])\s+/, '').trim();
  if(!s) return null;
  const o = { lane:null, priority:null, category:null, due:'', repeat:'none', project:'', notes:'' };
  const ni = s.indexOf(' // '); if(ni>=0){ o.notes = s.slice(ni+4).trim(); s = s.slice(0,ni); }
  s = s.replace(/\[([^\]]+)\]/g, (m,j) => { o.project = j.trim(); return ' '; });
  s = s.replace(/(^|\s)due:(\S+)/gi, (m,sp,v) => { o.due = parseDate(v); return ' '; });
  s = s.replace(/(^|\s)#([a-z]+)(?=\s|$)/gi, (m,sp,v) => { const l = LANE_TAGS[v.toLowerCase()]; if(l){ o.lane = l; return ' '; } return m; });
  s = s.replace(/(^|\s)!!(?=\s|$)/g, () => { o.priority = 'High'; return ' '; });
  s = s.replace(/(^|\s)!(high|hi|h|low|lo|l|med|medium|m)(?=\s|$)/gi, (m,sp,v) => { v = v.toLowerCase(); o.priority = v[0]==='h'?'High':v[0]==='l'?'Low':'Medium'; return ' '; });
  s = s.replace(/(^|\s)@([a-z][a-z-]*)(?=\s|$)/gi, (m,sp,v) => { const c = matchCategory(v); if(c){ o.category = c; return ' '; } return m; });
  s = s.replace(/(^|\s)\*(daily|weekdays|weekly|monthly)(?=\s|$)/gi, (m,sp,v) => { o.repeat = v.toLowerCase(); return ' '; });
  o.title = s.replace(/\s+/g,' ').trim();
  if(!o.title) return null;
  o.lane = o.lane || (def.lane && def.lane!=='auto' ? def.lane : laneForDue(o.due));
  return o;
}
window.quickAdd = (e, lane) => {
  e.preventDefault();
  const input = e.target.q, v = input.value.trim(); if(!v) return;
  const p = parseQuick(v, { lane }); if(!p) return;
  const L = p.lane;
  const task = normTask({ id:uid(), title:p.title, category:p.category || (state.filterCat!=='All'?state.filterCat:DEFAULT_CATEGORY),
    project:p.project, priority:p.priority||'Medium', due:p.due || (L==='today'&&lane==='today'?today():''), notes:p.notes, repeat:p.repeat, lane:L, order:topOrder(L) });
  refocus = 'qa-'+lane;
  setState({ tasks:[task, ...state.tasks] });
  if(L!==lane) toast(`Added to ${laneLabel(L)}`);
};

/* ── Drag and drop (mouse: press & drag · touch: press & hold, then drag) ───────── */
let drag = null, suppressClick = false;
function dragStart(){
  const d = drag; d.active = true;
  const r = d.item.getBoundingClientRect();
  d.offX = d.x - r.left; d.offY = d.y - r.top;
  const g = d.item.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width+'px'; g.removeAttribute('data-dragitem'); g.removeAttribute('onclick');
  document.body.appendChild(g); d.ghost = g;
  const ph = document.createElement('div'); ph.className = d.kind==='proj' ? 'pj-ph' : 'ph'; ph.style.height = r.height+'px'; d.ph = ph;
  d.item.parentNode.insertBefore(ph, d.item); d.item.style.display = 'none';
  document.body.classList.add('dragging');
  if(d.type!=='mouse' && navigator.vibrate) try{ navigator.vibrate(12); }catch{}
  dragMove(d.x, d.y);
  d.raf = requestAnimationFrame(dragLoop);
}
function zoneAt(x, y){
  const el = document.elementFromPoint(x, y), z = el && el.closest('[data-zone]');
  return z && z.dataset.kind===drag.kind ? z : null;
}
function dragMove(x, y){
  const d = drag; d.x = x; d.y = y;
  d.ghost.style.transform = `translate(${x-d.offX}px,${y-d.offY}px) rotate(${d.kind==='card'?1.5:0}deg)`;
  const z = zoneAt(x, y);
  document.querySelectorAll('.col.over').forEach(c => { if(c!==z) c.classList.remove('over'); });
  d.zone = z;
  if(!z) return;
  if(d.kind==='card') z.classList.add('over');
  const body = z.querySelector('[data-body]') || z; d.body = body;
  if(z.dataset.zone==='done'){ body.insertBefore(d.ph, body.firstElementChild); return; }
  const sibs = [...body.children].filter(c => c.dataset && c.dataset.dragitem && c!==d.item);
  const target = sibs.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height/2; });
  if(target){ if(d.ph.nextSibling!==target) body.insertBefore(d.ph, target); }
  else { const tail = body.querySelector(':scope > .tail'); if(tail) body.insertBefore(d.ph, tail); else if(body.lastElementChild!==d.ph) body.appendChild(d.ph); }
}
function dragLoop(){
  const d = drag; if(!d || !d.active) return;
  const { x, y } = d, vh = window.innerHeight, vw = window.innerWidth;
  if(y < 130) window.scrollBy(0, -Math.ceil((130-y)/5)); else if(y > vh-70) window.scrollBy(0, Math.ceil((y-(vh-70))/5));
  const board = document.querySelector('.board');
  if(board && d.kind==='card'){ if(x<60) board.scrollLeft -= Math.ceil((60-x)/4); else if(x>vw-60) board.scrollLeft += Math.ceil((x-(vw-60))/4); }
  if(d.body && d.body.scrollHeight > d.body.clientHeight){ const r = d.body.getBoundingClientRect(); if(y<r.top+40) d.body.scrollTop -= 8; else if(y>r.bottom-40) d.body.scrollTop += 8; }
  dragMove(x, y);
  d.raf = requestAnimationFrame(dragLoop);
}
function dragEnd(commit){
  const d = drag; drag = null; if(!d) return;
  clearTimeout(d.timer);
  if(!d.active) return;
  cancelAnimationFrame(d.raf);
  document.body.classList.remove('dragging');
  document.querySelectorAll('.col.over').forEach(c => c.classList.remove('over'));
  d.ghost.remove();
  const body = d.ph.parentNode, zone = body && body.closest('[data-zone]');
  const isItem = c => c && c.dataset && c.dataset.dragitem && c!==d.item;
  let prev = d.ph.previousElementSibling; while(prev && !isItem(prev)) prev = prev.previousElementSibling;
  let next = d.ph.nextElementSibling;     while(next && !isItem(next)) next = next.nextElementSibling;
  d.ph.remove(); d.item.style.display = '';
  suppressClick = true; setTimeout(()=>{ suppressClick = false; }, 50);
  if(commit && d.zone && zone){
    if(d.kind==='card') moveTask(d.id, zone.dataset.zone, { prevId: prev?prev.dataset.id:null, nextId: next?next.dataset.id:null, force:true });
    else moveProject(d.id, prev?prev.dataset.id:null, next?next.dataset.id:null);
  } else render();
  if(renderPending) render();
}
document.addEventListener('pointerdown', e => {
  if(state.modal || state.settings || state.focusMode) return;
  const item = e.target.closest('[data-dragitem]'); if(!item) return;
  const kind = item.dataset.dragitem;
  if(kind==='proj' && !e.target.closest('.handle')) return;
  if(kind==='card' && e.target.closest('button,input,select,textarea,a')) return;
  if(e.pointerType==='mouse' && e.button!==0) return;
  drag = { item, kind, id:item.dataset.id, sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, active:false, type:e.pointerType };
  if(kind==='proj'){ e.preventDefault(); dragStart(); }                          // the ⋮⋮ handle drags immediately
  else if(e.pointerType!=='mouse') drag.timer = setTimeout(()=>{ if(drag && !drag.active) dragStart(); }, 260);
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  if(!drag.active){
    drag.x = e.clientX; drag.y = e.clientY;
    const dist = Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy);
    if(drag.type==='mouse'){ if(dist>5) dragStart(); }
    else if(dist>10){ clearTimeout(drag.timer); drag = null; }                  // finger moved first → it's a scroll
    return;
  }
  e.preventDefault(); dragMove(e.clientX, e.clientY);
});
document.addEventListener('touchmove', e => { if(drag && drag.active) e.preventDefault(); }, { passive:false });
document.addEventListener('pointerup', () => dragEnd(true));
document.addEventListener('pointercancel', () => dragEnd(false));
document.addEventListener('keydown', e => { if(e.key==='Escape' && drag && drag.active) dragEnd(false); });
document.addEventListener('contextmenu', e => { if(drag) e.preventDefault(); });
document.addEventListener('click', e => { if(suppressClick){ e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('dragstart', e => { if(e.target.closest && e.target.closest('.card')) e.preventDefault(); });

  const dl = daysLeft(p.end);
  const dlText = dl===null ? 'No end date' : dl<0 ? `${Math.abs(dl)}d overdue` : dl===0 ? 'Due today' : `${dl}d left`;
  const dlColor = dl===null ? 'var(--faint)' : dl<0 ? 'var(--danger)' : dl<7 ? 'var(--warn-text)' : 'var(--text2)';
  const linked = linkedCards(p), open = linked.filter(t=>!t.done);

    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">${p.start?fmtDate(p.start):'—'} → ${p.end?fmtDate(p.end):'—'} · <b style="color:${dlColor}">${dlText}</b> · Last check-in: ${p.lastCheckin?fmtDate(p.lastCheckin):'—'}</div>
    <div class="label-up" style="margin-bottom:6px;">Linked cards (${linked.length})${doneCount?` <button onclick="toggleLinkedDone('${id}')" style="float:right;color:var(--accent);font-size:11px;font-weight:700;text-transform:none;letter-spacing:0">${showDone?'Hide':'Show'} ${doneCount} done</button>`:''}</div>
    ${vis.length ? vis.map(t=>`<div class="linked" onclick="openTask('${esc(t.id)}')"><span class="chk${t.done?' on':''}" style="width:14px;height:14px;font-size:9px;margin:0">${t.done?'✓':''}</span><span style="flex:1;min-width:0;font-size:13px;font-weight:600;word-break:break-word;${t.done?'color:var(--faint);text-decoration:line-through':''}">${esc(t.title)}</span><span class="pill ac">${esc(laneLabel(t.lane))}</span>${t.due&&!t.done?`<span style="font-size:11px;color:${isOverdue(t)?'var(--danger)':'var(--muted)'}">${esc(fmtShort(t.due))}</span>`:''}</div>`).join('')
      : `<div style="font-size:12px;color:var(--faint);font-style:italic;margin-bottom:10px;">No linked cards yet. Put this project’s exact name in a card’s Project field.</div>`}
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
      <button class="btn ok" style="padding:7px 11px;font-size:12px" onclick="projCheckin('${id}')">✓ Checked in today</button>
      <button class="btn" style="padding:7px 11px;font-size:12px;background:var(--accent-soft);color:var(--accent-text)" onclick="newCardForProject('${id}')">+ Card for this project</button>
      <span style="flex:1"></span>
      <button class="btn alt" style="padding:6px 11px;font-size:12px" onclick="openProject('${id}')">Edit</button>

      <div class="pj-name"><b>${esc(p.name)}</b><span>${[p.owner, p.health!=='On Track'?p.health:''].filter(Boolean).map(esc).join(' · ')}</span></div>

function moveProject(id, prevId, nextId){
  const list = state.projects, p = list.find(x=>x.id===id); if(!p) return;
  const others = list.filter(x=>x.id!==id);
  const pv = prevId && others.find(x=>x.id===prevId), nx = nextId && others.find(x=>x.id===nextId);
  const order = orderBetween(others, pv||null, nx||null);
  setState({ projects: state.projects.map(x => x.id===id ? { ...x, order } : x) });

    <div class="row2">${fld('Start', `<input type="date" name="start" value="${esc(p.start||'')}">`)}${fld('Target end', `<input type="date" name="end" value="${esc(p.end||'')}">`)}</div>

window.submitProject = (e, id) => {
  e.preventDefault(); const fd = new FormData(e.target);
  const name = String(fd.get('name')||'').trim(); if(!name) return;
  const prev = id ? state.projects.find(p=>p.id===id) : null;
  const p = { ...(prev||{}), id:id||uid(), name, owner:fd.get('owner')||'', start:fd.get('start')||'', end:fd.get('end')||'', pct:+fd.get('pct')||0, health:fd.get('health'), notes:fd.get('notes')||'' };
  if(!prev) p.order = (Math.max(0, ...state.projects.map(x=>x.order||0)) + 1000);
  // keep linked cards attached if the name changed
  let tasks = state.tasks;
  if(prev && prev.name!==name) tasks = tasks.map(t => t.project && t.project.toLowerCase().trim()===prev.name.toLowerCase().trim() ? { ...t, project:name } : t);
  closeModal(); setState({ projects: id ? state.projects.map(x => x.id===id ? p : x) : [...state.projects, p], tasks });

/* ── Focus mode: one card at a time from Today, with a timer ─────────────────── */
const ftimer = { dur:25*60, left:25*60, end:null };
const fmtClock = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s/60)}:${pad(s%60)}`; };
const timerLeft = () => ftimer.end ? (ftimer.end - Date.now())/1000 : ftimer.left;
function chime(){
  try{ const C = window.AudioContext||window.webkitAudioContext, ac = new C();
    [660,880,990].forEach((f,i) => { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*.25; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.25,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.22); o.start(t); o.stop(t+.25); }); }catch{}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch{}
}
setInterval(() => {
  if(!ftimer.end){ if(document.title!=='Task Tracker') document.title = 'Task Tracker'; return; }
  const l = timerLeft(), el = document.getElementById('fm-time'); if(el) el.textContent = fmtClock(l);
  document.title = `${fmtClock(l)} · Focus`;
  if(l<=0){ ftimer.end = null; ftimer.left = ftimer.dur; document.title = 'Task Tracker'; chime(); toast('⏰ Time’s up — nice focus session. Take a short break.'); render(); }
}, 500);
window.fmTimer = (act, min) => {
  if(act==='set'){ ftimer.dur = min*60; ftimer.left = min*60; ftimer.end = null; }
  else if(act==='start') ftimer.end = Date.now() + timerLeft()*1000;
  else if(act==='pause'){ ftimer.left = timerLeft(); ftimer.end = null; }
  else if(act==='reset'){ ftimer.end = null; ftimer.left = ftimer.dur; }
  render();
};
window.enterFocus = () => { ls.set('pt_focusmode','1'); closeModal(); setState({ focusMode:true }); window.scrollTo(0,0); };
window.exitFocus = () => { ls.del('pt_focusmode'); setState({ focusMode:false }); };
window.fmDone = id => { const rep = findTask(id)?.repeat; toggleDone(id); if(!rep || rep==='none') toast(`✓ Done! ${state.tasks.filter(t=>t.done&&t.completedAt===today()).length} finished today`); };
window.fmLater = id => setState({ tasks: state.tasks.map(t => t.id===String(id) ? { ...t, order:bottomOrder('today', id) } : t) });
window.fmNow = id => { setState({ tasks: state.tasks.map(t => t.id===String(id) ? { ...t, order:topOrder('today', id) } : t) }); window.scrollTo(0,0); };
window.fmWait = id => { moveTask(id,'waiting'); toast('Moved to Waiting'); };
window.fmToToday = id => moveTask(id,'today');
function buildFocus(){
  const list = sortLane('today', state.tasks.filter(t=>t.lane==='today'&&!t.done)), cur = list[0], next = list.slice(1);
  const doneToday = state.tasks.filter(t=>t.done&&t.completedAt===today()).length, running = !!ftimer.end;
  const presets = [15,25,50].map(m => `<button class="tbtn${ftimer.dur===m*60?' on':''}" onclick="fmTimer('set',${m})"${running?' disabled':''}>${m}m</button>`).join('');
  const timer = `<div class="fm-timer">${presets}<span id="fm-time" class="fm-time">${fmtClock(timerLeft())}</span>${running?`<button class="tbtn" onclick="fmTimer('pause')">❚❚ Pause</button>`:`<button class="tbtn on" onclick="fmTimer('start')">▶ Start</button>`}<button class="tbtn" onclick="fmTimer('reset')" title="Reset timer">↺</button></div>`;
  const top = `<div class="fm-top"><div class="fm-top-in"><div><div class="fm-title">🎯 Focus</div><div class="fm-sub">${list.length} left in Today · ${doneToday} done today</div></div>${timer}<button class="fm-exit" onclick="exitFocus()">Exit</button></div></div>`;
  const pills = t => `<span class="pill">${esc(t.category)}</span>${t.priority==='High'?`<span class="pill hi">High</span>`:''}${t.due?`<span class="pill ${isOverdue(t)?'hi':'n'}">${isOverdue(t)?'Overdue · ':''}${esc(fmtShort(t.due))}</span>`:''}${t.repeat!=='none'?`<span class="pill ac">↻ ${esc(t.repeat)}</span>`:''}`;
  const addBox = `<form class="qa" style="padding:0;margin-top:10px" onsubmit="quickAdd(event,'today')"><input id="qa-today" name="q" autocomplete="off" placeholder="+ Add something to Today"></form>`;
  let body;
  if(cur){
    const id = esc(cur.id);
    body = `<div class="fm-label">Now</div><div class="fm-now" style="${catStyle(cur.category)}">
      <div class="meta" style="padding:0;margin:0">${pills(cur)}</div>
      <h1 onclick="openTask('${id}')" title="Tap to edit">${esc(cur.title)}</h1>
      ${cur.project?`<div style="font-size:14px;color:var(--text2);font-weight:600">${esc(cur.project)}</div>`:''}
      ${cur.notes?`<div class="fm-notes">${esc(cur.notes)}</div>`:''}
      <div class="fm-actions"><button class="go" onclick="fmDone('${id}')">✓ Done</button><button onclick="fmLater('${id}')" title="Send to the end of Today">↓ Later today</button><button onclick="fmWait('${id}')">⏸ Waiting</button><button onclick="openPark()">🅿 Interrupted</button></div></div>
      <div class="fm-next"><div class="fm-label">Up next${next.length?` (${next.length})`:''}</div>
      ${next.map(t=>`<div class="fm-item" style="${catStyle(t.category)}"><span class="t" onclick="openTask('${esc(t.id)}')">${esc(t.title)}</span>${t.due?`<span class="d" style="${isOverdue(t)?'color:var(--danger)':''}">${esc(fmtShort(t.due))}</span>`:''}<button onclick="fmNow('${esc(t.id)}')">Do now</button></div>`).join('') || `<div style="font-size:13px;color:var(--faint);padding:4px 2px">That’s the last one for today.</div>`}${addBox}</div>`;
  } else {
    const week = sortLane('week', state.tasks.filter(t=>t.lane==='week'&&!t.done)).slice(0,8);
    body = `<div class="fm-empty"><div style="font-size:34px">🎉</div><div style="font-size:20px;font-weight:800;margin:6px 0 4px">Today is clear</div><div style="font-size:13.5px;color:var(--muted)">${doneToday?`You finished ${doneToday} card${doneToday!==1?'s':''} today. `:''}Pull something in from This Week, or add a new one.</div></div>
      ${week.length?`<div class="fm-next"><div class="fm-label">From this week</div>${week.map(t=>`<div class="fm-item" style="${catStyle(t.category)}"><span class="t" onclick="openTask('${esc(t.id)}')">${esc(t.title)}</span>${t.due?`<span class="d">${esc(fmtShort(t.due))}</span>`:''}<button onclick="fmToToday('${esc(t.id)}')">→ Today</button></div>`).join('')}</div>`:''}
      <div class="fm-next">${addBox}</div>`;
  }
  return `<div class="fm">${top}<div class="fm-body">${body}<div class="fm-stat">Tip: when something interrupts you, tap 🅿 so you can pick up right where you left off.</div></div></div>`;
}

window.downloadBackup = async () => {
  const data = { exportedAt:new Date().toISOString(), tasks:state.tasks.filter(t=>!t.sample), projects:state.projects, parking:state.parking, completedLog:await cloudLog() };
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download = `task-tracker-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
window.restoreBackup = async input => {
  const f = input.files && input.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text()); if(!d || typeof d!=='object') throw new Error('Not a backup file');
    const merge = (cur, inc) => { const have = new Set(cur.map(x=>String(x.id))); return [...cur, ...(inc||[]).filter(x=>!have.has(String(x.id)))]; };
    const tasks = merge(state.tasks.filter(t=>!t.sample), d.tasks), projects = merge(state.projects, d.projects), parking = merge(state.parking, d.parking);
    setState({ tasks:normTasks(tasks), projects, parking });
    toast(`Restored — ${tasks.length} cards, ${projects.length} projects`);
  }catch(e){ toast('Could not read that backup: '+e.message); }
  input.value = '';
};

/* ── Import (paste a list or an email, or upload a CSV / Excel file) ─────────────── */
const normH = h => String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const dupKey = t => `${t.title}|${t.project||''}`.toLowerCase().replace(/\s+/g,' ').trim();
const impIsEmail = im => im.email==='on' || (im.email==='auto' && /^\s*(subject|from)\s*:/im.test(im.text||''));
function parseEmail(text, def){
  const body = []; let subject = '', from = '';
  String(text).replace(/\r/g,'').split('\n').forEach(l => {
    const m = l.match(/^\s*(From|Sent|To|Cc|Bcc|Subject|Date|Reply-To)\s*:\s*(.*)$/i);
    if(m){ const k = m[1].toLowerCase(); if(k==='subject'&&!subject) subject = m[2].trim(); if(k==='from'&&!from) from = m[2].trim(); return; }
    body.push(l);
  });
  let bodyText = body.join('\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
  subject = subject.replace(/^(\s*(re|fw|fwd)\s*:\s*)+/i,'');
  if(!subject){ const first = bodyText.split('\n').find(x=>x.trim())||''; subject = first; bodyText = bodyText.slice(bodyText.indexOf(first)+first.length).trim(); }
  const p = parseQuick(subject.slice(0,200), def); if(!p) return null;
  const fromName = from.replace(/<([^>]*)>/,'').replace(/["']/g,'').trim() || ((from.match(/<([^>]*)>/)||[])[1]||'');
  p.project = p.project || fromName;
  p.notes = [p.notes, bodyText.slice(0,2000)+(bodyText.length>2000?'…':'')].filter(Boolean).join('\n\n');
  return p;
}
function parseCSV(text){
  text = String(text).replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0]||'';
  const delim = [',','\t',';'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch==='"' && cell==='') q = true;
    else if(ch===delim){ row.push(cell); cell = ''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function guessMap(headers){
  const H = headers.map(normH), used = [];
  const find = cands => { for(const c of cands){ let i = H.indexOf(c); if(i<0 || used.includes(i)) i = H.findIndex((h,k)=>h.includes(c)&&!used.includes(k)); if(i>=0&&!used.includes(i)){ used.push(i); return i; } } return -1; };
  const title = find(['task','title','description','subject','summary','name','item']);
  const project = find(['project','client','customer','category','list']);
  const due = find(['due','duedate','date','scheduled','deadline','when']);
  const notes = find(['notes','comments','details','address','location']);
  return { title: title>=0?title:0, project, due, notes };
}
function impParsed(){
  const im = state.imp, def = { lane: im.lane };
  if(im.tab==='paste'){
    if(impIsEmail(im)){ const p = parseEmail(im.text||'', def); return p ? [p] : []; }
    return String(im.text||'').split(/\r?\n/).map(l => parseQuick(l, def)).filter(Boolean);
  }
  if(!im.file) return [];
  const m = im.map, g = (r,i) => i>=0 ? String(r[i]??'').trim() : '';
  return im.file.rows.map(r => {
    const title = g(r,m.title); if(!title) return null;
    const due = parseDate(g(r,m.due));
    const notes = m.notes>=0 && g(r,m.notes) ? `${im.file.headers[m.notes]}: ${g(r,m.notes)}` : '';
    return { title:title.slice(0,200), project:g(r,m.project), notes, due, lane: im.lane==='auto' ? laneForDue(due) : im.lane, priority:null, category:null, repeat:'none' };
  }).filter(Boolean);
}
function impBuild(){
  const im = state.imp, open = new Set(state.tasks.filter(t=>!t.done).map(dupKey)), seen = new Set(), cards = []; let dups = 0;
  impParsed().forEach(p => {
    const c = normTask({ id:uid(), title:p.title, category:p.category||im.category, project:p.project, priority:p.priority||'Medium', due:p.due||'', notes:p.notes, repeat:p.repeat||'none', lane:p.lane });
    const k = dupKey(c); if(open.has(k)||seen.has(k)){ dups++; return; } seen.add(k); cards.push(c);
  });
  return { cards, dups };
}
function impRefresh(){
  const box = document.getElementById('imp-preview'); if(!box || !state.imp) return;
  const im = state.imp, { cards, dups } = impBuild();
  const mode = document.getElementById('imp-mode');
  if(mode) mode.textContent = impIsEmail(im) ? 'Reading as an email: subject → title, sender → project, body → notes' : 'Each line becomes a card';
  const list = cards.slice(0,40).map(c => `<div style="padding:7px 9px;border-bottom:1px solid var(--border)"><div style="font-size:13px;font-weight:600;word-break:break-word">${esc(c.title)}</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;align-items:center"><span class="pill ac">${esc(laneLabel(c.lane))}</span><span class="pill" style="${catStyle(c.category)}">${esc(c.category)}</span>${c.priority!=='Medium'?`<span class="pill ${c.priority==='High'?'hi':'n'}">${c.priority}</span>`:''}${c.due?`<span class="pill n">${esc(fmtShort(c.due))}</span>`:''}${c.repeat!=='none'?`<span class="pill ac">↻ ${c.repeat}</span>`:''}${c.project?`<span style="font-size:11.5px;color:var(--muted)">${esc(c.project)}</span>`:''}</div></div>`).join('');
  box.innerHTML = `<div style="font-size:12px;color:var(--text2);margin:10px 0 6px"><b>${cards.length}</b> new card${cards.length!==1?'s':''}${dups?` · ${dups} already on the board (skipped)`:''}</div>${cards.length?`<div style="border:1px solid var(--border);border-radius:9px;max-height:260px;overflow-y:auto">${list}${cards.length>40?`<div style="padding:7px 9px;font-size:12px;color:var(--faint)">+ ${cards.length-40} more</div>`:''}</div>`:''}`;
  const go = document.getElementById('imp-go'); if(go){ go.textContent = cards.length ? `Add ${cards.length} card${cards.length!==1?'s':''}` : 'Add cards'; go.disabled = !cards.length; }
}
window.openImport = (text, lane) => {
  state.imp = { tab:'paste', text:text||'', email:'auto', lane:lane||ls.get('pt_imp_lane')||'auto', category:ls.get('pt_imp_cat')||DEFAULT_CATEGORY, file:null, map:null };
  openModal({ type:'import' }); impRefresh();
};
// light=true → don't rebuild the form (keeps the cursor in the textarea)
window.impSet = (k, v, light) => {
  state.imp[k] = v; if(k==='lane') ls.set('pt_imp_lane',v); if(k==='category') ls.set('pt_imp_cat',v);
  if(!light) renderModal(); impRefresh();
};
window.impMap = (k, v) => { state.imp.map = { ...state.imp.map, [k]: +v }; renderModal(); impRefresh(); };
async function loadXLSX(){
  if(window.XLSX) return;
  await new Promise((res,rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = res; s.onerror = () => rej(new Error('Could not load the Excel reader — check your connection, or save the file as CSV.')); document.head.appendChild(s); });
}
window.impFile = async input => {
  const f = input.files && input.files[0]; if(!f) return;
  try{
    let rows;
    if(/\.(xlsx|xlsm|xls)$/i.test(f.name)){ await loadXLSX(); const wb = XLSX.read(await f.arrayBuffer(), {type:'array'}); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''}); }
    else rows = parseCSV(await f.text());
    rows = rows.map(r => (r||[]).map(c => String(c??'').trim()));
    const hi = rows.findIndex(r => r.filter(Boolean).length>=2); if(hi<0) throw new Error('Couldn’t find a header row in that file.');
    const headers = rows[hi].map((h,i) => h || `Column ${i+1}`);
    state.imp.file = { name:f.name, headers, rows: rows.slice(hi+1).filter(r=>r.some(Boolean)) };
    state.imp.map = guessMap(headers);
    renderModal(); impRefresh();
  }catch(e){ toast(e.message||'Could not read that file'); }
};
window.impCommit = () => {
  const { cards, dups } = impBuild();
  if(!cards.length){ toast(dups?`Nothing new — ${dups} already on the board`:'Nothing to import'); return; }
  const byLane = {}; cards.forEach(c => (byLane[c.lane] = byLane[c.lane]||[]).push(c));
  Object.entries(byLane).forEach(([lane,arr]) => { const base = topOrder(lane); arr.forEach((c,i) => { c.order = base - (arr.length-i)*10; }); }); // keep list order, at the top of each column
  closeModal(); setState({ tasks:[...cards, ...state.tasks] });
  toast(`Added ${cards.length} card${cards.length!==1?'s':''}${dups?` · ${dups} duplicate${dups!==1?'s':''} skipped`:''}`);
};
function importForm(){
  const im = state.imp;
  const tabBtn = (id,l) => `<button type="button" class="${im.tab===id?'on':''}" onclick="impSet('tab','${id}')">${l}</button>`;
  const laneOpts = [{id:'auto',label:'Auto (by due date)'}, ...LANES.filter(l=>l.id!=='done')];
  const common = `<div class="row2" style="margin-top:10px">${fld('Put cards in', `<select onchange="impSet('lane',this.value,true)">${laneOpts.map(o=>`<option value="${o.id}"${o.id===im.lane?' selected':''}>${esc(o.label)}</option>`).join('')}</select>`)}${fld('Category', `<select onchange="impSet('category',this.value,true)">${CATEGORIES.map(c=>`<option${c.name===im.category?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`)}</div>`;
  let body;
  if(im.tab==='paste'){
    const seg = `<div class="seg">${[['auto','Auto'],['off','Each line = a card'],['on','One email = one card']].map(([id,l])=>`<button type="button" class="${im.email===id?'on':''}" onclick="impSet('email','${id}')">${l}</button>`).join('')}</div>`;
    body = `<textarea id="imp-text" rows="8" oninput="impSet('text',this.value,true)" placeholder="Paste a list (one task per line) or a whole email…&#10;&#10;Call the plumber #today !high @home&#10;Renew car registration due:fri @errands&#10;Weekly review *weekly due:sun @admin">${esc(im.text||'')}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 10px">${seg}<span id="imp-mode" style="font-size:11.5px;color:var(--muted)"></span></div>
      <details style="font-size:12px;color:var(--text2);margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">Quick tags (also work in “+ Add a card”)</summary><div style="line-height:1.8;margin-top:6px">
        <code>#today</code> <code>#week</code> <code>#backlog</code> <code>#waiting</code> — which column<br><code>!high</code> or <code>!!</code> · <code>!low</code> — priority<br>
        ${CATEGORIES.map(c=>`<code>@${esc(c.name.toLowerCase())}</code>`).join(' ')} — category<br><code>due:today</code> <code>due:fri</code> <code>due:9/30</code> <code>due:+3</code> — due date<br>
        <code>*daily</code> <code>*weekdays</code> <code>*weekly</code> <code>*monthly</code> — repeats<br><code>[Project name]</code> — project · <code>// text</code> — notes</div></details>`;
  } else {
    const f = im.file, m = im.map;
    const colSel = (k,label,optional) => fld(label, `<select onchange="impMap('${k}',this.value)">${optional?`<option value="-1">— none —</option>`:''}${f.headers.map((h,i)=>`<option value="${i}"${m[k]===i?' selected':''}>${esc(h)}</option>`).join('')}</select>`);
    body = `<div style="border:1.5px dashed var(--border2);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--surface2)"><input type="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm" onchange="impFile(this)" style="border:none;padding:0;font-size:13px">
      <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${f?`<b>${esc(f.name)}</b> · ${f.rows.length} row${f.rows.length!==1?'s':''}`:'Choose a CSV or Excel file (first sheet). Then match its columns below.'}</div></div>
      ${f?`<div class="row2">${colSel('title','Card title',false)}${colSel('project','Project',true)}${colSel('due','Due date',true)}${colSel('notes','Notes',true)}</div>`:''}`;
  }
  return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap"><h3 style="margin:0">⤓ Import cards</h3><div class="seg">${tabBtn('paste','Paste text / email')}${tabBtn('file','CSV / Excel')}</div></div>
    ${body}${common}<div id="imp-preview"></div>
    <div class="actions" style="margin-top:12px"><span class="sp"></span><button type="button" class="btn alt" onclick="closeModal()">Cancel</button><button id="imp-go" type="button" class="btn" onclick="impCommit()">Add cards</button></div>`;
}
// Pasting several lines into a “+ Add a card” box opens Import with that text
document.addEventListener('paste', e => {
  const inp = e.target.closest && e.target.closest('.qa input'); if(!inp) return;
  const text = (e.clipboardData||window.clipboardData)?.getData('text')||'';
  if(!/\n\s*\S/.test(text.trim())) return;
  e.preventDefault(); openImport(text, inp.id.replace('qa-',''));
});

/* ── PWA: install prompt + service worker ───────────────────────────────────── */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if(!ls.get('pt_pwa_dismissed')) $('#install-banner').classList.add('show'); });
window.triggerInstall = () => { if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(()=>{ deferredPrompt = null; $('#install-banner').classList.remove('show'); }); } };
window.dismissInstall = () => { $('#install-banner').classList.remove('show'); ls.set('pt_pwa_dismissed','1'); };
window.dismissIosHint = () => { $('#ios-hint').classList.remove('show'); ls.set('pt_ios_dismissed','1'); };
if(/iphone|ipad|ipod/i.test(navigator.userAgent) && !navigator.standalone && !ls.get('pt_ios_dismissed')) setTimeout(()=>$('#ios-hint').classList.add('show'), 2500);
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ── Go ─────────────────────────────────────────────────────────────────────── */
applyTheme();
render();
initCloud();
// a new day started while the app stayed open → refresh dates
let lastDay = today();
setInterval(() => { if(today()!==lastDay){ lastDay = today(); render(); } }, 60000);
</script>
